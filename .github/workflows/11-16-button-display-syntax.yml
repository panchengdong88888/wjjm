name: 11.16 button display candidate syntax

on:
  push:
    paths:
      - "11.16/测试管理/当前测试/测试版_11.16_跳过帐号验证_纯按钮显示验证.lua"
      - ".github/workflows/11-16-button-display-syntax.yml"

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua-version: ["5.1", "5.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua-version }}
      - name: Compile candidate
        run: luac -p "11.16/测试管理/当前测试/测试版_11.16_跳过帐号验证_纯按钮显示验证.lua"
