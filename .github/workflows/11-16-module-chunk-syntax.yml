name: 11.16 full module chunk syntax check

on:
  push:
    branches:
      - "test/11.16-main-disable-doinit"
    paths:
      - "11.16/MainLeftBottom_11.16_明文.lua"
      - "11.16/测试版_Main函数屏蔽doInit_第一阶段.lua"
      - "11.16/测试版_纯模块加载_屏蔽main自动启动.lua"
      - "11.16/测试版_LOAD-004_恢复root局部闭包作用域_保持main与doInit屏蔽.lua"
      - ".github/workflows/11-16-module-chunk-syntax.yml"
  workflow_dispatch:

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua-version: ["5.1", "5.4"]
    steps:
      - name: Checkout exact test branch
        uses: actions/checkout@v4
      - name: Set up Lua ${{ matrix.lua-version }}
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua-version }}
      - name: Compile formal source and both isolated test files
        run: |
          lua -v
          luac -p "11.16/MainLeftBottom_11.16_明文.lua"
          luac -p "11.16/测试版_Main函数屏蔽doInit_第一阶段.lua"
          luac -p "11.16/测试版_纯模块加载_屏蔽main自动启动.lua"
          luac -p "11.16/测试版_LOAD-004_恢复root局部闭包作用域_保持main与doInit屏蔽.lua"
          echo "Lua ${{ matrix.lua-version }} syntax check passed for all three files."
